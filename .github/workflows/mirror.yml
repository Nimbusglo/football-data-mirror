name: Mirror football-data.co.uk

# Copies football-data.co.uk's free, published CSV files into this repository
# once a day, unchanged, so the Football Intelligence app can read them from
# raw.githubusercontent.com where the site itself is blocked by the connection.
#
# It downloads files only — no scraping, no logins, no secrets. A file is kept
# only if it still looks like a football-data file; anything else (an error
# page, a block page) is skipped and the previous copy stays.

on:
  schedule:
    - cron: "40 5 * * *" # every day at 05:40 UTC
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Extra season codes to fetch as well, space-separated (e.g. "2425 2526")'
        required: false
        default: ""

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the CSV files
        env:
          EXTRA_SEASONS: ${{ github.event.inputs.seasons }}
        run: |
          set -uo pipefail
          BASE="https://www.football-data.co.uk"
          # Main leagues: the six the app covers, plus Belgium and 2. Bundesliga.
          LEAGUES="E0 D1 SP1 I1 F1 N1 B1 D2"

          Y=$(date -u +%Y); M=$(date -u +%-m)
          if [ "$M" -lt 7 ]; then Y=$((Y-1)); fi
          CURRENT="$(printf '%02d%02d' $((Y%100)) $(((Y+1)%100)))"
          SEASONS="$CURRENT ${EXTRA_SEASONS:-}"

          fetch() { # url, destination, a column the file must contain
            local url="$1" dest="$2" must="$3"
            mkdir -p "$(dirname "$dest")"
            if curl -sfL --max-time 90 -A "Mozilla/5.0" -o /tmp/file.csv "$url" \
               && head -1 /tmp/file.csv | grep -q "$must"; then
              mv /tmp/file.csv "$dest"
              echo "OK    $dest ($(wc -l < "$dest") lines)"
            else
              echo "SKIP  $url"
            fi
          }

          for S in $SEASONS; do
            for L in $LEAGUES; do
              fetch "$BASE/mmz4281/$S/$L.csv" "data/mmz4281/$S/$L.csv" "HomeTeam"
            done
          done

          # Extra leagues (all seasons in one file each): Switzerland, Denmark.
          fetch "$BASE/new/SWZ.csv" "data/new/SWZ.csv" "Home"
          fetch "$BASE/new/DNK.csv" "data/new/DNK.csv" "Home"

          # Upcoming fixtures, when the site publishes them.
          fetch "$BASE/fixtures.csv" "data/fixtures.csv" "HomeTeam"
          fetch "$BASE/new_league_fixtures.csv" "data/new_league_fixtures.csv" "Home"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes today"
          else
            git commit -m "Mirror update $(date -u +%F)"
            git push
          fi
